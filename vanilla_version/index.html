<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 통독 계산기</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>📖 성경 통독 계산기</h1>
        
        <div class="tabs">
            <button id="tab-target" class="tab-btn active" onclick="switchTab('target')">어디까지 읽게 될까?</button>
            <button id="tab-count" class="tab-btn" onclick="switchTab('count')">총 몇 장일까?</button>
        </div>

        <!-- Target Calculator Section -->
        <div id="section-target" class="calculator-section active">
            <div class="description">
                시작하는 곳과 읽을 장 수를 입력하면, <strong>마지막에 읽게 될 말씀</strong>이 어디인지 알려드립니다.
            </div>
            
            <div class="input-group">
                <label>시작 성경</label>
                <select id="target-start-book"></select>
            </div>
            
            <div class="input-group">
                <label>시작 장 (Chapter)</label>
                <input type="number" id="target-start-chapter" value="1" min="1">
            </div>

            <div class="input-group">
                <label>읽을 장 수 (Count)</label>
                <input type="number" id="target-read-count" value="10" min="1">
            </div>

            <button class="action-btn" onclick="calculateTarget()">계산하기</button>

            <div id="result-target" class="result-box hidden">
                결과가 여기에 표시됩니다.
            </div>
        </div>

        <!-- Count Calculator Section -->
        <div id="section-count" class="calculator-section">
            <div class="description">
                시작 말씀과 끝 말씀을 입력하면, <strong>총 읽어야 할 장 수</strong>를 계산해 드립니다.
            </div>

            <div class="input-group">
                <label>시작 성경</label>
                <select id="count-start-book"></select>
            </div>
            
            <div class="input-group">
                <label>시작 장</label>
                <input type="number" id="count-start-chapter" value="1" min="1">
            </div>

            <div class="divider">~ 부터 ~</div>

            <div class="input-group">
                <label>끝 성경</label>
                <select id="count-end-book"></select>
            </div>
            
            <div class="input-group">
                <label>끝 장</label>
                <input type="number" id="count-end-chapter" value="1" min="1">
            </div>

            <button class="action-btn" onclick="calculateCount()">계산하기</button>

            <div id="result-count" class="result-box hidden">
                결과가 여기에 표시됩니다.
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
